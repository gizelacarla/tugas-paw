<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Registrasi</title>
</head>
<body>
    <h2>Form Registrasi</h2>
    <form action="" method="post" enctype="multipart/form-data">
        <fieldset>
            <legend>Biodata</legend>
            <table cellpadding="4" cellspacing="0" width="600">
                <tr>
                    <td width="200"><label for="nama">Nama Mahasiswa</label></td>
                    <td width="10">:</td>
                    <td><input type="text" id="nama" name="nama" placeholder="Nama Anda"></td>
                </tr>
                <tr>
                    <td><label for="nim">No Induk Mahasiswa (NIM)</label></td>
                    <td>:</td>
                    <td><input type="text" id="nim" name="nim" value="123456789"></td>
                </tr>
                <tr>
                    <td valign="top"><label for="alamat">Alamat Mahasiswa</label></td>
                    <td valign="top">:</td>
                    <td>
                        <textarea id="alamat" name="alamat" rows="4" cols="35" placeholder="Alamat Anda"></textarea>
                    </td>
                </tr>
                <tr>
                    <td>Tanggal Lahir</td>
                    <td>:</td>
                    <td>
                        <select name="tgl">
                            <option value="01">01</option>
                        </select>
                        <select name="bln">
                            <option value="Januari">Januari</option>
                        </select>
                        <select name="thn">
                            <option value="1990">1990</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Jenis Kelamin</td>
                    <td>:</td>
                    <td>
                        <input type="radio" id="pria" name="jk" value="Pria" checked>
                        <label for="pria">Pria</label>
                        <input type="radio" id="wanita" name="jk" value="Wanita">
                        <label for="wanita">Wanita</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="foto">Upload Foto</label></td>
                    <td>:</td>
                    <td><input type="file" id="foto" name="foto"></td>
                </tr>
                <tr>
                    <td><label for="website">URL Website</label></td>
                    <td>:</td>
                    <td><input type="url" id="website" name="website" placeholder="URL Website Anda" size="30"></td>
                </tr>
                <tr>
                    <td><label for="pt">Perguruan Tinggi</label></td>
                    <td>:</td>
                    <td><input type="text" id="pt" name="pt"></td>
                </tr>
            </table>
        </fieldset>
        <br>
        <fieldset>
            <legend>Info Akun</legend>
            <table cellpadding="4" cellspacing="0" width="600">
                <tr>
                    <td width="200"><label for="email">Email</label></td>
                    <td width="10">:</td>
                    <td><input type="email" id="email" name="email" placeholder="Email Anda"></td>
                </tr>
                <tr>
                    <td><label for="username">Username</label></td>
                    <td>:</td>
                    <td><input type="text" id="username" name="username" placeholder="Username Anda"></td>
                </tr>
                <tr>
                    <td><label for="password">Password</label></td>
                    <td>:</td>
                    <td><input type="password" id="password" name="password" placeholder="Password Anda"></td>
                </tr>
                <tr>
                    <td><label for="ulang_password">Ulangi Password</label></td>
                    <td>:</td>
                    <td><input type="password" id="ulang_password" name="ulang_password" placeholder="Password Anda"></td>
                </tr>
            </table>
        </fieldset>
        <br>
        <fieldset>
            <legend>Kemampuan Dasar</legend>
            <table cellpadding="4" cellspacing="0" width="600">
                <tr>
                    <td>
                        <input type="checkbox" id="html" name="skill[]" value="HTML">
                        <label for="html">HTML</label>
                        
                        <input type="checkbox" id="css" name="skill[]" value="CSS">
                        <label for="css">CSS</label>
                        
                        <input type="checkbox" id="javascript" name="skill[]" value="Javascript">
                        <label for="javascript">Javascript</label>
                        
                        <input type="checkbox" id="php" name="skill[]" value="PHP">
                        <label for="php">PHP</label>
                        
                        <input type="checkbox" id="mysql" name="skill[]" value="MySQL">
                        <label for="mysql">MySQL</label>
                        
                        <input type="checkbox" id="laravel" name="skill[]" value="Laravel">
                        <label for="laravel">Laravel</label>
                        
                        <input type="checkbox" id="react" name="skill[]" value="React Native">
                        <label for="react">React Native</label>
                    </td>
                </tr>
            </table>
        </fieldset>
        <br>
        <div>
            <input type="reset" value="Reset">
            <input type="submit" value="Simpan">
            <input type="button" value="Button">
        </div>
    </form>
</body>
</html>
